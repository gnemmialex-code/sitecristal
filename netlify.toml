# Configuration Netlify — site Next.js (App Router, Next 16).

[build]
  command = "npm run build"
  # Le plugin Next.js transforme .next en fonctions + assets statiques.
  publish = ".next"

[build.environment]
  # Next 16 exige Node >= 20. On épingle pour éviter qu'un changement de
  # version par défaut chez Netlify ne casse le build.
  NODE_VERSION = "22"

# Photos et vidéos : le navigateur les garde 7 jours, sans les redemander à
# chaque visite (moins de bande passante consommée).
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Runtime Next.js de Netlify : SSR, routes dynamiques et next/image.
[[plugins]]
  package = "@netlify/plugin-nextjs"
